# 本端 HQ：swanctl.conf —— 只支持 aes128
connections {
    hq-branch {
        version = 2
        local_addrs  = 203.0.113.10
        remote_addrs = 198.51.100.23
        proposals = aes128-sha256-modp2048
        dpd { delay = 30s; timeout = 150s }
        local {
            id = fqdn:hq-vpn.example.com
            auth = psk
        }
        remote {
            id = fqdn:branch-01.example.com
            auth = psk
        }
        children {
            net {
                local_ts  = 10.10.0.0/16
                remote_ts = 192.168.50.0/24
                esp_proposals = aes256-sha256
                lifetime = 1h
            }
        }
    }
}
