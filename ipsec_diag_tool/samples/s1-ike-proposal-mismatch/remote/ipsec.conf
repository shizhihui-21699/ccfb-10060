# 对端分支：ipsec.conf（老式语法）—— 强制 aes256
conn hq-branch
    keyexchange=ikev2
    left=198.51.100.23
    leftid=fqdn:branch-01.example.com
    leftsubnet=192.168.50.0/24
    right=203.0.113.10
    rightid=fqdn:hq-vpn.example.com
    rightsubnet=10.10.0.0/16
    authby=secret
    ike=aes256-sha256-modp2048!
    esp=aes256-sha256!
    dpdaction=restart
    dpddelay=30s
    dpdtimeout=150s
    auto=start
